[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jingzhi"
version = "0.1.0"
description = "Local-first multimodal desktop context companion"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faster-whisper>=1.2,<2",
  "keyring>=25.7,<26",
  "mss>=10,<12",
  "numpy>=2,<3",
  "openai>=2,<3",
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "soundcard>=0.4.5,<0.5",
  "sounddevice>=0.5.5,<0.6",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
jingzhi = "jingzhi.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jingzhi"]
artifacts = ["src/jingzhi/static/markdown/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
