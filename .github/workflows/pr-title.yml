name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Accept Dependabot title
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot pull request title accepted"

      - name: Validate title format
        if: github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = r"^(feat|fix|test|refactor|docs|build|chore)(\([^)]+\))?: .+ \(#[1-9][0-9]*\)$"
          if not re.fullmatch(pattern, title):
              print("PR title must match: type(scope): title (#Issue)")
              print("Allowed types: feat, fix, test, refactor, docs, build, chore")
              print(f"Received: {title}")
              sys.exit(1)
          PY
